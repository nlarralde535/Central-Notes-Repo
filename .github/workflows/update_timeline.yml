name: Fred

on:
  push:
    branches: [ "new_master", "workflow-tinkering" ]
  pull_request:
    branches: [ "new_master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  check:
    name: Check for new entries in timeline/timeline_entries/
    runs-on: ubuntu-latest
    # DOC: https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/pass-job-outputs
    # DOC: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idoutputs
    outputs:
      newEntries: ${{ steps.checking.outputs.entries }}
      reactAppUpdates: ${{ steps.checking.outputs.react_app_updates }}
      reviewNoteUpdates: ${{ steps.checking.outputs.review_note_updates }}
    steps:
      - name: Checkout the repo with fetch-depth = 2
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Extract the number of new ./timeline_entries/ and or react-app/ files in HEAD commit
        id: checking      
        run: |
          echo "# ------------------------------------"
          echo "#    CHECKING FOR NEW timeline_entries/"
          echo "# git log -1 --oneline --name-status"
          git log -1 --oneline --name-status
          NUMBER_OF_NEW_ENTRIES=$(git diff HEAD^ --name-only  | grep 'timeline_entries/' | wc -l)
          # DOC: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#setting-an-environment-variable
          # DOC: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#setting-an-output-parameter
          # DOC: https://docs.github.com/en/actions/reference/workflows-and-actions/variables
          echo "entries=$NUMBER_OF_NEW_ENTRIES" >> "$GITHUB_OUTPUT"
          echo "Number of new entries: [$NUMBER_OF_NEW_ENTRIES]"
          echo "# -----------------------------------"
          echo "#    CHECKING FOR UPDATES TO react-app/"
          REACT_APP_UPDATES=$(git diff HEAD^ --name-only | grep 'react-app/' | wc -l)
          echo "react_app_updates=$REACT_APP_UPDATES" >> "$GITHUB_OUTPUT"
          echo "Number of React App updates: [$REACT_APP_UPDATES]"
          echo "# -----------------------------------"
          echo "#    CHECKING FOR UPDATES TO THE DAILY REVIEW NOTES"
          # These 4-Repo/ notes are converted to HTML by
          # scripts/build-review-html.mjs, so editing one has to redeploy the
          # site or the published Daily Review goes stale.
          REVIEW_NOTE_UPDATES=$(git diff HEAD^ --name-only | grep -E '^4-Repo/(What To Do|How To Be|Policy Positions|Openings|Test Questions)\.md$' | wc -l)
          echo "review_note_updates=$REVIEW_NOTE_UPDATES" >> "$GITHUB_OUTPUT"
          echo "Number of Daily Review note updates: [$REVIEW_NOTE_UPDATES]"
  build:
    runs-on: ubuntu-latest
    needs: check
    # DOC: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idif
    # DOC: https://docs.github.com/en/actions/reference/workflows-and-actions/expressions
    # DOC: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context
    if: ${{ needs.check.outputs.newEntries > 0  ||  needs.check.outputs.reactAppUpdates > 0  ||  needs.check.outputs.reviewNoteUpdates > 0 }}
    steps:
      - name: Checkout the new commit
        uses: actions/checkout@v5
      - name: Set up Node on the runner
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and build the React app
        working-directory: timeline/react-app
        run: |
          echo "PWD: [$(pwd)]"
          echo "Node version: [$(node --version)]"
          npm ci
          echo "RUNNING: npm run prebuild"
          npm run prebuild
          echo "...DONE"
          echo "RUNNING: npm run build"
          npm run build
          echo "...DONE"
          echo "# stat ./timeline/pages/index.html"
          stat ../pages/index.html
      - name: Upload static Pages file index.html as artifact
        # DOC: https://github.com/marketplace/actions/upload-github-pages-artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: ./timeline/pages
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
