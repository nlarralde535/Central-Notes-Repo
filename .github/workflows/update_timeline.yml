# This is a basic workflow to help you get started with Actions

name: Fred

on:
  push:
    branches: [ "new_master", "workflow-tinkering" ]
  pull_request:
    branches: [ "new_master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  check:
    name: Check for new timeline entries
    runs-on: ubuntu-latest
    outputs: 
      newEntries: ${{ steps.checking.outputs.entries }}
    steps:
      - name: Checkout the repo with fetch-depth = 2
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Extract the number of new ./timeline_entries/ files in HEAD commit
        id: checking      
        run: |
          echo "# git log -1 --oneline --name-status"
          git log -1 --oneline --name-status
          echo "# git diff HEAD^ --name-only | grep 'timeline_entries/' | wc -l"
          NUMBER_OF_NEW_ENTRIES=$(git diff HEAD^ --name-only  | grep 'timeline_entries/' | wc -l)
          echo "entries=$NUMBER_OF_NEW_ENTRIES" >> "$GITHUB_OUTPUT"
          echo "Number of new entries: [$NUMBER_OF_NEW_ENTRIES]"
  build:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.newEntries > 0 }}
    steps:
      - name: Checkout the new commit
        uses: actions/checkout@v4
      - name: Set up python on the runner
        uses: actions/setup-python@v6
        with:
          python-version: '3.13' 
      - name: Run the timeline.py script to build a new timeline.html
        run: |
          echo "Python version: [$(python --version)]"
          echo "Running timeline script..."
          python timeline.py
          echo "...script completed"
          echo "# stat ./pages/timeline.html"
          stat ./pages/index.html
      - name: Upload static index.html file to Pages
        # DOC: https://github.com/marketplace/actions/upload-github-pages-artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: ./pages
  deploy:
    # DOC: https://github.com/actions/deploy-pages
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
